<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Sistema de Rifas</title>
    <style>
        /* ===== ESTILOS GENERALES ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #000000 0%, #6a0400 100%);
            background-attachment: fixed;
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { max-width: 1200px; margin: 0 auto; width: 100%; }
        
        /* ===== TARJETAS ===== */
        .card { background: rgb(45, 2, 2); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 30px; margin-bottom: 20px; position: relative; }
        
        /* ===== ENCABEZADO ===== */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #f9f8f8; font-size: 2.2em; }
        
        /* ===== BOTONES ===== */
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
        .btn-primary { background: #ca0505; color: white; }
        .btn-success { background: #0e7b04; color: white; }
        .btn-danger { background: #ef4444; color: white; padding: 8px 12px; }
        .btn-secondary { background: #6b7280; color: white; }
        
        /* ===== GRID DE RIFAS ===== */
        .rifas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        
        /* ===== TARJETA DE RIFA ===== */
        .rifa-card { background: linear-gradient(135deg, #630505 0%, #000000 100%); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(56, 7, 7, 0.1); transition: transform 0.3s; position: relative; overflow: hidden; }
        .rifa-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .rifa-card h3 { color: #ffffff; margin-bottom: 15px; font-size: 1.5em; }
        
        /* ===== INFORMACIÓN DE RIFA ===== */
        .rifa-info { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .info-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #555; }
        
        /* ===== ESTADÍSTICAS ===== */
        .stats { display: flex; justify-content: space-between; font-size: 0.9em; margin-top: 10px; }
        .stat-vendido { color: #09ad48; font-weight: bold; }
        .stat-porpagar { color: #f59e0b; font-weight: bold; }
        .stat-disponible { color: #ef4444; font-weight: bold; }
        
        /* ===== MODALES (VENTANAS EMERGENTES) ===== */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; overflow-y: auto; }
        .modal.active { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .close-btn { color: #b90606; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        
        /* ===== FORMULARIOS ===== */
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 16px; }
        
        /* ===== GRID DE NÚMEROS ===== */
        .numeros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 8px; margin: 20px 0; max-width: 100%; }
        
        /* ===== BOTONES DE NÚMEROS ===== */
        .numero-btn { aspect-ratio: 1; border: none; border-radius: 8px; font-weight: bold; font-size: clamp(0.8rem, 2vw, 1.1rem); color: white; cursor: pointer; transition: transform 0.2s; min-height: 50px; }
        .numero-btn.disponible { background: #ef4444; }
        .numero-btn.reservado { background: #f59e0b; }
        .numero-btn.vendido { background: #038533; }
        .numero-btn.seleccionado { background: #8b5cf6; border: 3px solid #fbbf24; }
        
        /* ===== FORMULARIO DE RESERVA ===== */
        .formulario-reserva { background: #f3f4f6; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .formulario-reserva input { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        
        /* ===== NÚMEROS SELECCIONADOS ===== */
        .numeros-seleccionados { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .badge-numero { background: #8b5cf6; color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; margin-right: 5px; display: inline-block; margin-bottom: 5px; }
        
        /* ===== LEYENDA DE COLORES ===== */
        .leyenda { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .leyenda-item { display: flex; align-items: center; gap: 8px; }
        .leyenda-color { width: 20px; height: 20px; border-radius: 50%; }
        
        /* ===== OTROS ===== */
        .empty-state { text-align: center; padding: 60px 20px; color: white; }
        .rifa-detail-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .small { font-size: 0.9rem; color: #555; }
        .alert-reserva { background: #fef3c7; border-left: 4px solid #f59e0b; padding: 15px; margin: 15px 0; border-radius: 8px; }
        .alert-reserva strong { color: #92400e; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>SORTEOS DE EFECTIVO CON LA LOTERIA DE BOYACA</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" id="btnGrupo" style="display: none;">📱 Grupo WhatsApp</button>
                    <button class="btn btn-primary" id="btnAdmin">⚙️ Admin</button>
                </div>
            </div>
            <div id="rifasContainer"></div>
        </div>
    </div>

    <!-- Modal Login -->
    <div class="modal" id="modalLogin">
        <div class="modal-content" style="max-width: 420px;">
            <span class="close-btn" onclick="cerrarModal('modalLogin')">← Volver</span>
            <h2>Acceso Administrador</h2>
            <div class="form-group">
                <label>Contraseña</label>
                <input id="inputPassword" type="password" placeholder="Contraseña admin">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-primary" onclick="login()">Entrar</button>
                <button class="btn btn-secondary" onclick="cerrarModal('modalLogin')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Nueva Rifa -->
    <div class="modal" id="modalNuevaRifa">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal('modalNuevaRifa')">← Volver</span>
            <h2>Nueva Rifa</h2>
            <div class="form-group">
                <label>Nombre</label>
                <input id="nombreRifa" type="text" placeholder="Nombre de la rifa">
            </div>
            <div class="form-group">
                <label>Precio</label>
                <input id="precioRifa" type="number" placeholder="Precio por número">
            </div>
            <div class="form-group">
                <label>Premio</label>
                <input id="premioRifa" type="text" placeholder="Premio">
            </div>
            <div class="form-group">
                <label>Fecha Sorteo</label>
                <input id="fechaRifa" type="date">
            </div>
            <div class="form-group">
                <label>WhatsApp Grupo (opcional)</label>
                <input id="whatsappGrupo" type="url" placeholder="https://chat.whatsapp.com/....">
            </div>
            <div style="display:flex; gap:10px;">
                <button class="btn btn-success" onclick="crearRifa()">Crear</button>
                <button class="btn btn-secondary" onclick="cerrarModal('modalNuevaRifa')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Rifa -->
    <div class="modal" id="modalVerRifa">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal('modalVerRifa')">← Volver</span>
            <div id="rifaDetalleContainer"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC2jjXcONaf6Sej9hQ4ZqTVwUI2Nlz_2qg",
            authDomain: "sistema-rifas-cc455.firebaseapp.com",
            databaseURL: "https://rifas-9b39c-default-rtdb.firebaseio.com",
            projectId: "sistema-rifas-cc455",
            storageBucket: "sistema-rifas-cc455.appspot.com",
            messagingSenderId: "661191615304",
            appId: "1:661191615304:web:e57e8eb88dda2350bec97d",
            measurementId: "G-ZGXFGV2YSZ"
        };

        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            } else {
                firebase.app();
            }
        } catch (err) {
            console.error('Error inicializando Firebase:', err);
            alert('Error inicializando Firebase (ver consola).');
        }

        const db = firebase.database();

        const ADMIN_PASSWORD = 'admin123';
        const NEQUI = '3116516861';
        let isAdmin = false;
        let rifas = [];
        let rifaActual = null;
        let numerosSeleccionados = [];
        let reservasActivas = {};
        let whatsappGrupo = '';

        // ✅ FUNCIÓN PARA FORMATEAR NÚMEROS CON CERO ADELANTE
        function formatearNumero(num) {
            return num < 10 ? '0' + num : '' + num;
        }

        function init() {
            db.ref('rifas').on('value', (snapshot) => {
                const data = snapshot.val();
                rifas = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                renderRifas();

                if (rifaActual) {
                    const actualizada = rifas.find(r => r.id === rifaActual.id);
                    if (actualizada) {
                        rifaActual = actualizada;
                        if (document.getElementById('modalVerRifa').classList.contains('active')) {
                            verRifa(rifaActual.id, true);
                        }
                    } else {
                        cerrarModal('modalVerRifa');
                    }
                }
            });

            db.ref('reservasActivas').on('value', (snapshot) => {
                reservasActivas = snapshot.val() || {};
                verificarReservasExpiradas();
            });

            db.ref('config/whatsappGrupo').on('value', (snapshot) => {
                whatsappGrupo = snapshot.val() || '';
                document.getElementById('btnGrupo').style.display = whatsappGrupo ? 'inline-flex' : 'none';
                if (whatsappGrupo) {
                    document.getElementById('btnGrupo').onclick = () => window.open(whatsappGrupo, '_blank');
                }
            });

            setInterval(verificarReservasExpiradas, 30000);
            document.getElementById('btnAdmin').onclick = () => isAdmin ? abrirModal('modalNuevaRifa') : abrirModal('modalLogin');
        }

        function login() {
            if (document.getElementById('inputPassword').value === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('btnAdmin').innerHTML = '➕ Nueva Rifa';
                cerrarModal('modalLogin');
                renderRifas();
            } else { 
                alert('Contraseña incorrecta'); 
            }
        }

        function crearRifa() {
            const nombre = document.getElementById('nombreRifa').value.trim();
            const precio = Number(document.getElementById('precioRifa').value);
            const premio = document.getElementById('premioRifa').value.trim();
            const fecha = document.getElementById('fechaRifa').value;
            const whatsapp = document.getElementById('whatsappGrupo').value.trim();

            if (!nombre || !precio || !premio || !fecha) return alert('Completa todos los campos');

            const numeros = {};
            // ✅ CAMBIO AQUÍ: Solo hasta 99
            for (let i = 1; i <= 99; i++) {
                numeros[i] = { numero: i, estado: 'disponible' };
            }

            db.ref('rifas').push({ nombre, precio, premio, fecha, numeros })
              .then(() => {
                  if (whatsapp) db.ref('config/whatsappGrupo').set(whatsapp);
                  alert('¡Rifa creada!');
                  cerrarModal('modalNuevaRifa');
                  document.getElementById('nombreRifa').value = '';
                  document.getElementById('precioRifa').value = '';
                  document.getElementById('premioRifa').value = '';
                  document.getElementById('fechaRifa').value = '';
                  document.getElementById('whatsappGrupo').value = '';
              });
        }

        function renderRifas() {
            const container = document.getElementById('rifasContainer');
            if (rifas.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>No hay rifas disponibles</p></div>`;
                return;
            }

            container.innerHTML = `<div class="rifas-grid">` + rifas.map(rifa => {
                const nums = Object.values(rifa.numeros || {});
                const vendidos = nums.filter(n => n.estado === 'vendido').length;
                const reservados = nums.filter(n => n.estado === 'reservado').length;
                const disponibles = nums.filter(n => n.estado === 'disponible').length;

                return `
                    <div class="rifa-card">
                        ${isAdmin ? `<button class="btn btn-danger" style="position:absolute; top:10px; right:10px;" onclick="eliminarRifa('${rifa.id}')">🗑️</button>` : ''}
                        <h3>${escapeHtml(rifa.nombre)}</h3>
                        <div class="rifa-info">
                            <div class="info-item">💰 Precio: $${escapeHtml(rifa.precio)}</div>
                            <div class="info-item">🏆 Premio: ${escapeHtml(rifa.premio)}</div>
                            <div class="info-item">📅 Sorteo: ${escapeHtml(rifa.fecha)}</div>
                            <div class="stats">
                                <span class="stat-vendido">Vendidos: ${vendidos}</span>
                                <span class="stat-porpagar">Reservados: ${reservados}</span>
                                <span class="stat-disponible">Disponibles: ${disponibles}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="verRifa('${rifa.id}')">👁️ Ver Cartón</button>
                    </div>
                `;
            }).join('') + `</div>`;
        }

        function verRifa(id, keepSelection = false) {
            rifaActual = rifas.find(r => r.id === id);
            if (!rifaActual) return;
            if (!keepSelection) numerosSeleccionados = [];

            const numsArray = Object.values(rifaActual.numeros || {});
            const container = document.getElementById('rifaDetalleContainer');

            container.innerHTML = `
                <h2>${escapeHtml(rifaActual.nombre)}</h2>
                <div class="rifa-detail-header">
                    <div class="small">💰 $${escapeHtml(rifaActual.precio)} | 🏆 ${escapeHtml(rifaActual.premio)} | 📅 ${escapeHtml(rifaActual.fecha)}</div>
                </div>
                
                <div class="alert-reserva">
                    <strong>⏰ Importante:</strong> Reserva válida por <strong>5 minutos</strong>
                </div>
                
                <div class="leyenda">
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #038533;"></div><span>Vendido</span></div>
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #f59e0b;"></div><span>Reservado</span></div>
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #ef4444;"></div><span>Disponible</span></div>
                </div>
                
                <div class="numeros-grid">
                    ${numsArray.map(num => {
                        const estado = num?.estado || 'disponible';
                        const disabled = (!isAdmin && (estado === 'vendido' || estado === 'reservado')) ? 'disabled' : '';
                        const selClass = numerosSeleccionados.includes(Number(num.numero)) ? 'seleccionado' : '';
                        const click = isAdmin ? `cambiarEstadoAdmin(${num.numero})` : `seleccionarNumero(${num.numero})`;
                        // ✅ AQUÍ SE FORMATEA EL NÚMERO CON CERO ADELANTE
                        return `<button class="numero-btn ${estado} ${selClass}" onclick="${click}" ${disabled}>${formatearNumero(num.numero)}</button>`;
                    }).join('')}
                </div>

                ${!isAdmin ? `<div class="formulario-reserva" style="display: ${numerosSeleccionados.length > 0 ? 'block' : 'none'};">
                    <div class="numeros-seleccionados">
                        <h4>Seleccionados:</h4>
                        ${numerosSeleccionados.map(n => `<span class="badge-numero">${formatearNumero(n)}</span>`).join('')}
                    </div>
                    <input type="text" id="nombreCliente" placeholder="Nombre completo">
                    <input type="tel" id="nequiCliente" placeholder="Número Nequi">
                    <button class="btn btn-success" style="width: 100%;" onclick="enviarReservaWhatsApp()">💬 Reservar por WhatsApp</button>
                </div>` : ''}
            `;

            abrirModal('modalVerRifa');
        }

        function cambiarEstadoAdmin(numero) {
            if (!rifaActual) return;
            const estados = ['disponible', 'reservado', 'vendido'];
            const actual = rifaActual.numeros[numero]?.estado || 'disponible';
            const nuevo = estados[(estados.indexOf(actual) + 1) % 3];

            db.ref(`rifas/${rifaActual.id}/numeros/${numero}`).update({ estado: nuevo })
              .then(() => {
                  if (nuevo === 'disponible') {
                      db.ref(`reservasActivas/${rifaActual.id}-${numero}`).remove();
                  }
              });
        }

        function seleccionarNumero(numero) {
            const idx = numerosSeleccionados.indexOf(numero);
            idx > -1 ? numerosSeleccionados.splice(idx, 1) : numerosSeleccionados.push(numero);
            verRifa(rifaActual.id, true);
        }

        function enviarReservaWhatsApp() {
            const nombre = document.getElementById('nombreCliente').value.trim();
            const nequi = document.getElementById('nequiCliente').value.trim();
            
            if (!nombre || !nequi || numerosSeleccionados.length === 0) {
                return alert('Completa todos los datos');
            }

            const updates = {};
            const timestamp = Date.now();
            
            numerosSeleccionados.forEach(n => {
                updates[`rifas/${rifaActual.id}/numeros/${n}/estado`] = 'reservado';
                updates[`reservasActivas/${rifaActual.id}-${n}`] = {
                    rifaId: rifaActual.id,
                    numero: n,
                    timestamp: timestamp
                };
            });

            db.ref().update(updates).then(() => {
                const total = numerosSeleccionados.length * rifaActual.precio;
                // ✅ NÚMEROS FORMATEADOS EN WHATSAPP
                const numerosFormateados = numerosSeleccionados.map(n => formatearNumero(n)).join(', ');
                const msg = `¡Hola! Quiero reservar números en: ${rifaActual.nombre}

Sorteo: ${rifaActual.fecha}
Premio: ${rifaActual.premio}
Precio: $${rifaActual.precio}

Mis datos:
- Nombre: ${nombre}
- Nequi: ${nequi}
- Números: ${numerosFormateados}
- Total: $${total}

Nequi para pagos: ${NEQUI}

*Nota: Reserva válida por 5 minutos*`;

                window.open(`https://wa.me/57${NEQUI}?text=${encodeURIComponent(msg)}`, '_blank');
                alert('¡Reserva enviada! Tienes 5 minutos');
                cerrarModal('modalVerRifa');
            });
        }

        function verificarReservasExpiradas() {
            const ahora = Date.now();
            const limite = 5 * 60 * 1000;
            
            Object.keys(reservasActivas || {}).forEach(key => {
                const res = reservasActivas[key];
                if (!res) return;
                
                if (ahora - res.timestamp > limite) {
                    db.ref(`rifas/${res.rifaId}/numeros/${res.numero}`).update({ estado: 'disponible' });
                    db.ref(`reservasActivas/${key}`).remove();
                }
            });
        }

        function eliminarRifa(id) {
            if (confirm('¿Eliminar rifa?')) {
                db.ref(`rifas/${id}`).remove();
            }
        }

        function abrirModal(id) { 
            document.getElementById(id).classList.add('active'); 
        }
        
        function cerrarModal(id) { 
            document.getElementById(id).classList.remove('active'); 
            if(id === 'modalVerRifa') {
                rifaActual = null;
                numerosSeleccionados = [];
            }
        }

        function escapeHtml(unsafe) {
            if (!unsafe) return '';
            return String(unsafe)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        init();
    </script>
</body>
</html>
