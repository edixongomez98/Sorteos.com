<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rifas Pro - Interrapidísimo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            padding: 25px;
            margin-bottom: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        h1 { color: #1e3a8a; font-size: 2em; }
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-primary { background: #4f46e5; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-secondary { background: #6b7280; color: white; }
        
        /* Grid de Rifas */
        .rifas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }
        .rifa-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            position: relative;
        }
        .info-item { margin-bottom: 8px; font-size: 0.95em; }
        
        /* Grid de Números */
        .numeros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(45px, 1fr));
            gap: 8px;
            margin: 20px 0;
        }
        .numero-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            font-size: 0.9em;
        }
        .disponible { background: #ef4444; } /* Rojo */
        .reservado { background: #f59e0b; }  /* Naranja */
        .vendido { background: #10b981; }    /* Verde */
        .seleccionado { background: #7c3aed; outline: 3px solid #fbbf24; }
        
        /* Modales */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }
        .modal.active { display: flex; align-items: center; justify-content: center; }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 600px;
            position: relative;
        }
        .close-btn { color: #4f46e5; cursor: pointer; font-weight: bold; margin-bottom: 15px; display: block; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🏆 Sorteos Express</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-primary" id="btnAdmin">⚙️ Admin</button>
                </div>
            </div>
            <div id="rifasContainer"></div>
        </div>
    </div>

    <div class="modal" id="modalLogin">
        <div class="modal-content" style="max-width: 350px;">
            <span class="close-btn" onclick="cerrarModal('modalLogin')">✕ Cerrar</span>
            <h3>Acceso Admin</h3>
            <input type="password" id="passAdmin" placeholder="Contraseña">
            <button class="btn btn-primary" style="width:100%" onclick="login()">Entrar</button>
        </div>
    </div>

    <div class="modal" id="modalNuevaRifa">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal('modalNuevaRifa')">✕ Cancelar</span>
            <h2>Nueva Rifa</h2>
            <input type="text" id="nombRifa" placeholder="Nombre (ej: Sorteo iPhone)">
            <input type="number" id="precRifa" placeholder="Precio por número">
            <input type="text" id="premRifa" placeholder="Premio">
            <input type="date" id="fechRifa">
            <button class="btn btn-success" style="width:100%" onclick="crearRifa()">Publicar Rifa</button>
        </div>
    </div>

    <div class="modal" id="modalVerRifa">
        <div class="modal-content" style="max-width: 800px;">
            <span class="close-btn" onclick="cerrarModal('modalVerRifa')">← Volver</span>
            <div id="detalleRifa"></div>
            <div class="numeros-grid" id="gridNumeros"></div>
            
            <div id="areaReserva" style="display:none; background: #f3f4f6; padding: 15px; border-radius: 10px;">
                <h4>Tus números: <span id="listaSeleccion"></span></h4>
                <input type="text" id="nomCliente" placeholder="Nombre completo">
                <input type="tel" id="telCliente" placeholder="Número Nequi">
                <p style="font-size: 0.8em; margin: 5px 0;">* Envío físico por <b>Interrapidísimo</b> incluido.</p>
                <button class="btn btn-success" style="width:100%" onclick="confirmarReserva()">🚀 Reservar y pagar</button>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyC2jjXcONaf6Sej9hQ4ZqTVwUI2Nlz_2qg",
            authDomain: "sistema-rifas-cc455.firebaseapp.com",
            projectId: "sistema-rifas-cc455",
            storageBucket: "sistema-rifas-cc455.firebasestorage.app",
            messagingSenderId: "661191615304",
            appId: "1:661191615304:web:e57e8eb88dda2350bec97d"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // VARIABLES GLOBALES
        const NEQUI = "3116516861";
        const ADMIN_PASS = "admin123";
        let isAdmin = false;
        let listaRifas = [];
        let rifaActiva = null;
        let misSeleccionados = [];

        // INICIO
        function init() {
            db.ref('rifas').on('value', (snapshot) => {
                const data = snapshot.val();
                listaRifas = data ? Object.keys(data).map(key => ({...data[key], fbKey: key})) : [];
                renderHome();
                
                // Actualizar cartón si está abierto
                if (rifaActiva) {
                    const actualizada = listaRifas.find(r => r.id === rifaActiva.id);
                    if (actualizada) {
                        rifaActiva = actualizada;
                        renderCarton();
                    }
                }
            });
        }

        function login() {
            if (document.getElementById('passAdmin').value === ADMIN_PASS) {
                isAdmin = true;
                cerrarModal('modalLogin');
                document.getElementById('btnAdmin').innerText = "➕ Nueva Rifa";
                alert("Modo Administrador Activo");
                renderHome();
            } else { alert("Error"); }
        }

        function crearRifa() {
            const nom = document.getElementById('nombRifa').value;
            const pre = document.getElementById('precRifa').value;
            const prm = document.getElementById('premRifa').value;
            const fec = document.getElementById('fechRifa').value;

            if(!nom || !pre) return alert("Faltan datos");

            const nums = {};
            for(let i=1; i<=100; i++) {
                nums[i] = { n: i, e: 'disponible' };
            }

            const nueva = {
                id: Date.now(),
                nombre: nom,
                precio: pre,
                premio: prm,
                fecha: fec,
                numeros: nums
            };

            db.ref('rifas').push(nueva);
            cerrarModal('modalNuevaRifa');
        }

        function renderHome() {
            const cont = document.getElementById('rifasContainer');
            if (listaRifas.length === 0) {
                cont.innerHTML = "<p>No hay sorteos activos.</p>";
                return;
            }

            cont.innerHTML = `<div class="rifas-grid">` + listaRifas.map(r => `
                <div class="rifa-card">
                    ${isAdmin ? `<button class="btn-danger" style="position:absolute; right:10px;" onclick="eliminarRifa('${r.fbKey}')">🗑️</button>` : ''}
                    <h3>${r.nombre}</h3>
                    <p>🏆 Premio: ${r.premio}</p>
                    <p>💰 Valor: $${r.precio}</p>
                    <p>📅 Fecha: ${r.fecha}</p>
                    <button class="btn btn-primary" style="width:100%; margin-top:10px;" onclick="abrirCarton('${r.fbKey}')">Ver Números</button>
                </div>
            `).join('') + `</div>`;
        }

        function abrirCarton(key) {
            rifaActiva = listaRifas.find(r => r.fbKey === key);
            misSeleccionados = [];
            abrirModal('modalVerRifa');
            renderCarton();
        }

        function renderCarton() {
            document.getElementById('detalleRifa').innerHTML = `
                <h2>${rifaActiva.nombre}</h2>
                <p>Haz clic en los números para elegir. Los verdes ya están vendidos.</p>
            `;

            const grid = document.getElementById('gridNumeros');
            grid.innerHTML = "";

            // Firebase guarda los números como objeto o array. Manejamos ambos:
            const numsObj = rifaActiva.numeros;
            
            for (let i = 1; i <= 100; i++) {
                const nInfo = numsObj[i];
                const btn = document.createElement('button');
                btn.className = `numero-btn ${nInfo.e}`;
                if (misSeleccionados.includes(i)) btn.classList.add('seleccionado');
                btn.innerText = i;
                
                btn.onclick = () => {
                    if (isAdmin) {
                        cambiarEstadoAdmin(i, nInfo.e);
                    } else {
                        toggleSeleccion(i, nInfo.e);
                    }
                };
                grid.appendChild(btn);
            }
        }

        function toggleSeleccion(num, estado) {
            if (estado !== 'disponible') return;
            const idx = misSeleccionados.indexOf(num);
            if (idx > -1) misSeleccionados.splice(idx, 1);
            else misSeleccionados.push(num);
            
            renderCarton();
            const area = document.getElementById('areaReserva');
            area.style.display = misSeleccionados.length > 0 ? 'block' : 'none';
            document.getElementById('listaSeleccion').innerText = misSeleccionados.join(', ');
        }

        function cambiarEstadoAdmin(num, estadoActual) {
            const nuevosEstados = { 'disponible': 'reservado', 'reservado': 'vendido', 'vendido': 'disponible' };
            db.ref(`rifas/${rifaActiva.fbKey}/numeros/${num}`).update({ e: nuevosEstados[estadoActual] });
        }

        function confirmarReserva() {
            const nom = document.getElementById('nomCliente').value;
            const tel = document.getElementById('telCliente').value;
            if(!nom || !tel) return alert("Escribe tu nombre y teléfono");

            misSeleccionados.forEach(n => {
                db.ref(`rifas/${rifaActiva.fbKey}/numeros/${n}`).update({ e: 'reservado', cliente: nom });
            });

            const msg = `¡Hola! Reservé los números ${misSeleccionados.join(', ')} para el sorteo ${rifaActiva.nombre}. Mi nombre es ${nom}. Envíame los datos para el pago Nequi.`;
            window.open(`https://wa.me/57${NEQUI}?text=${encodeURIComponent(msg)}`);
            cerrarModal('modalVerRifa');
        }

        function eliminarRifa(key) {
            if(confirm("¿Eliminar?")) db.ref(`rifas/${key}`).remove();
        }

        function abrirModal(id) { document.getElementById(id).classList.add('active'); }
        function cerrarModal(id) { 
            document.getElementById(id).classList.remove('active'); 
            if(id === 'modalVerRifa') rifaActiva = null;
        }

        document.getElementById('btnAdmin').onclick = () => {
            if (isAdmin) abrirModal('modalNuevaRifa');
            else abrirModal('modalLogin');
        };

        init();
    </script>
</body>
</html>
