<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rifas</title>
    <style>
        /* Mantenemos tu CSS original intacto */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .card { background: white; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 30px; margin-bottom: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #333; font-size: 2.5em; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: #667eea; color: white; }
        .btn-success { background: #10b981; color: white; }
        .btn-danger { background: #ef4444; color: white; padding: 8px 12px; }
        .btn-secondary { background: #6b7280; color: white; }
        .rifas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .rifa-card { background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s; position: relative; }
        .rifa-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .rifa-card h3 { color: #333; margin-bottom: 15px; font-size: 1.5em; }
        .rifa-info { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .info-item { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; color: #555; }
        .stats { display: flex; justify-content: space-between; font-size: 0.9em; margin-top: 10px; }
        .stat-vendido { color: #10b981; font-weight: bold; }
        .stat-porpagar { color: #f59e0b; font-weight: bold; }
        .stat-disponible { color: #ef4444; font-weight: bold; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; overflow-y: auto; }
        .modal.active { display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: white; border-radius: 12px; padding: 30px; max-width: 900px; width: 95%; max-height: 90vh; overflow-y: auto; }
        .close-btn { color: #667eea; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: inline-block; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: bold; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 16px; }
        .numeros-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(50px, 1fr)); gap: 8px; margin: 20px 0; max-width: 100%; }
        .numero-btn { aspect-ratio: 1; border: none; border-radius: 8px; font-weight: bold; font-size: clamp(0.8rem, 2vw, 1.1rem); color: white; cursor: pointer; transition: transform 0.2s; min-height: 45px; display: flex; align-items: center; justify-content: center; }
        .numero-btn.disponible { background: #ef4444; }
        .numero-btn.reservado { background: #f59e0b; }
        .numero-btn.vendido { background: #10b981; }
        .numero-btn.seleccionado { background: #8b5cf6; border: 3px solid #fbbf24; }
        .formulario-reserva { background: #f3f4f6; padding: 20px; border-radius: 8px; margin-top: 20px; }
        .formulario-reserva input { width: 100%; padding: 12px; border: 2px solid #e5e7eb; border-radius: 8px; font-size: 16px; margin-bottom: 15px; }
        .numeros-seleccionados { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        .badge-numero { background: #8b5cf6; color: white; padding: 6px 12px; border-radius: 20px; font-weight: bold; margin-right: 5px; }
        .leyenda { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .leyenda-item { display: flex; align-items: center; gap: 8px; }
        .leyenda-color { width: 20px; height: 20px; border-radius: 50%; }
        .empty-state { text-align: center; padding: 60px 20px; }
        .rifa-detail-header { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Sistema de Rifas</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" id="btnGrupo" style="display: none;">📱 Grupo WhatsApp</button>
                    <button class="btn btn-primary" id="btnAdmin">⚙️ Admin</button>
                </div>
            </div>
            <div id="rifasContainer"></div>
        </div>
    </div>

    <div class="modal" id="modalLogin"><div class="modal-content" style="max-width: 400px;"><span class="close-btn" onclick="cerrarModal('modalLogin')">← Volver</span><h2 style="margin-bottom: 20px;">Acceso Administrador</h2><div class="form-group"><input type="password" id="inputPassword" placeholder="Contraseña"></div><button class="btn btn-primary" style="width: 100%;" onclick="login()">Ingresar</button></div></div>
    <div class="modal" id="modalNuevaRifa"><div class="modal-content"><span class="close-btn" onclick="cerrarModal('modalNuevaRifa')">← Volver</span><h2>Nueva Rifa</h2><div class="form-group"><label>Nombre</label><input type="text" id="nombreRifa"></div><div class="form-group"><label>Precio</label><input type="number" id="precioRifa"></div><div class="form-group"><label>Premio</label><input type="text" id="premioRifa"></div><div class="form-group"><label>Fecha</label><input type="date" id="fechaRifa"></div><div class="form-group"><label>WhatsApp Grupo</label><input type="text" id="whatsappGrupo"></div><button class="btn btn-primary" onclick="crearRifa()">Crear Rifa</button></div></div>
    <div class="modal" id="modalVerRifa"><div class="modal-content"><span class="close-btn" onclick="cerrarModal('modalVerRifa')">← Volver</span><div id="rifaDetalleContainer"></div></div></div>

    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <script>
        // CONFIGURACIÓN FIREBASE
        const firebaseConfig = {
    apiKey: "AIzaSyC2jjXcONaf6Sej9hQ4ZqTVwUI2Nlz_2qg",
    authDomain: "sistema-rifas-cc455.firebaseapp.com",
    // Esta es la URL que aparece en tu imagen:
    databaseURL: "https://sistema-rifas-cc455-default-rtdb.firebaseio.com/",
    projectId: "sistema-rifas-cc455",
    storageBucket: "sistema-rifas-cc455.firebasestorage.app",
    messagingSenderId: "661191615304",
    appId: "1:661191615304:web:e57e8eb88dda2350bec97d",
    measurementId: "G-ZGXFGV2YSZ"
};

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // VARIABLES (Se alimentarán de Firebase)
        const ADMIN_PASSWORD = 'Gmz1998ferMono';
        const NEQUI = '3116516861';
        let isAdmin = false;
        let rifas = [];
        let rifaActual = null;
        let numerosSeleccionados = [];
        let reservasActivas = {};
        let whatsappGrupo = '';

        // --- INTEGRACIÓN DE BASE DE DATOS ---

        function init() {
            // 1. Escuchar Rifas en tiempo real
            db.ref('rifas').on('value', (snapshot) => {
                const data = snapshot.val();
                // Convertimos el objeto de Firebase a Array para mantener tu lógica
                rifas = data ? Object.keys(data).map(key => ({...data[key], id: key})) : [];
                renderRifas();

                // Si se está viendo una rifa, actualizarla
                if (rifaActual) {
                    const actualizada = rifas.find(r => r.id === rifaActual.id);
                    if (actualizada) {
                        rifaActual = actualizada;
                        // Solo refrescamos el contenido si el modal está abierto
                        if(document.getElementById('modalVerRifa').classList.contains('active')) {
                            // Re-renderizar sin perder la selección actual de números si es posible
                            verRifa(rifaActual.id, true); 
                        }
                    }
                }
            });

            // 2. Escuchar Reservas
            db.ref('reservasActivas').on('value', (snapshot) => {
                reservasActivas = snapshot.val() || {};
                verificarReservasExpiradas();
            });

            // 3. Escuchar WhatsApp Grupo
            db.ref('config/whatsappGrupo').on('value', (snapshot) => {
                whatsappGrupo = snapshot.val() || '';
                if (whatsappGrupo) {
                    document.getElementById('btnGrupo').style.display = 'inline-flex';
                    document.getElementById('btnGrupo').onclick = () => window.open(whatsappGrupo, '_blank');
                }
            });

            setInterval(verificarReservasExpiradas, 30000);

            document.getElementById('btnAdmin').onclick = () => {
                isAdmin ? abrirModal('modalNuevaRifa') : abrirModal('modalLogin');
            };
        }

        function login() {
            if (document.getElementById('inputPassword').value === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('btnAdmin').innerHTML = '➕ Nueva Rifa';
                cerrarModal('modalLogin');
                renderRifas();
            } else { alert('Contraseña incorrecta'); }
        }

        function crearRifa() {
            const nombre = document.getElementById('nombreRifa').value;
            const precio = document.getElementById('precioRifa').value;
            const premio = document.getElementById('premioRifa').value;
            const fecha = document.getElementById('fechaRifa').value;
            const whatsapp = document.getElementById('whatsappGrupo').value;

            if (!nombre || !precio || !premio || !fecha) return alert('Campos obligatorios');

            const numeros = {};
            for (let i = 1; i <= 100; i++) {
                numeros[i] = { numero: i, estado: 'disponible' };
            }

            const nuevaRifa = { nombre, precio, premio, fecha, numeros };

            // Guardar en Firebase
            db.ref('rifas').push(nuevaRifa);
            if (whatsapp) db.ref('config/whatsappGrupo').set(whatsapp);

            cerrarModal('modalNuevaRifa');
        }

        function renderRifas() {
            const container = document.getElementById('rifasContainer');
            if (rifas.length === 0) {
                container.innerHTML = `<div class="empty-state"><p>No hay rifas</p></div>`;
                return;
            }

            container.innerHTML = `<div class="rifas-grid">` + rifas.map(rifa => {
                const nums = Object.values(rifa.numeros);
                const vendidos = nums.filter(n => n.estado === 'vendido').length;
                const reservados = nums.filter(n => n.estado === 'reservado').length;
                const disponibles = nums.filter(n => n.estado === 'disponible').length;

                return `
                    <div class="rifa-card">
                        ${isAdmin ? `<button class="btn btn-danger" style="position:absolute; top:10px; right:10px;" onclick="eliminarRifa('${rifa.id}')">🗑️</button>` : ''}
                        <h3>${rifa.nombre}</h3>
                        <div class="rifa-info">
                            <div class="info-item">💰 Precio: $${rifa.precio}</div>
                            <div class="info-item">🏆 Premio: ${rifa.premio}</div>
                            <div class="info-item">📅 Sorteo: ${rifa.fecha}</div>
                            <div class="stats">
                                <span class="stat-vendido">V: ${vendidos}</span>
                                <span class="stat-porpagar">R: ${reservados}</span>
                                <span class="stat-disponible">D: ${disponibles}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="verRifa('${rifa.id}')">👁️ Ver Cartón</button>
                    </div>
                `;
            }).join('') + `</div>`;
        }

        function verRifa(id, keepSelection = false) {
            rifaActual = rifas.find(r => r.id === id);
            if (!rifaActual) return;
            if (!keepSelection) numerosSeleccionados = [];

            const numsArray = Object.values(rifaActual.numeros);
            const container = document.getElementById('rifaDetalleContainer');
            
            container.innerHTML = `
                <h2>${rifaActual.nombre}</h2>
                <div class="rifa-detail-header">
                    <div class="info-item">💰 Precio: $${rifaActual.precio} | 🏆 Premio: ${rifaActual.premio} | 📅 Sorteo: ${rifaActual.fecha}</div>
                </div>
                <div class="leyenda">
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #10b981;"></div><span>Vendido</span></div>
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #f59e0b;"></div><span>Reservado</span></div>
                    <div class="leyenda-item"><div class="leyenda-color" style="background: #ef4444;"></div><span>Disponible</span></div>
                </div>
                <div class="numeros-grid">
    ${numsArray.map(num => {
        const numFormateado = num.numero.toString().padStart(2, '0');
        return `
        <button class="numero-btn ${num.estado} ${numerosSeleccionados.includes(num.numero) ? 'seleccionado' : ''}" 
        id="num-${num.numero}"
        onclick="${isAdmin ? `cambiarEstadoAdmin(${num.numero})` : `seleccionarNumero(${num.numero})`}"
        ${(!isAdmin && (num.estado === 'vendido' || num.estado === 'reservado')) ? 'disabled' : ''}>
        ${numFormateado}</button>
        `;
    }).join('')}
</div>
                ${!isAdmin ? `<div class="formulario-reserva" id="formularioReserva" style="display: ${numerosSeleccionados.length > 0 ? 'block' : 'none'};">
                    <div class="numeros-seleccionados"><h4>Seleccionados:</h4><div class="badges-numeros" id="badgesNumeros">
                        ${numerosSeleccionados.map(n => `<span class="badge-numero">${n.toString().padStart(2, '0')}</span>`).join('')}
                    </div></div>
                    <input type="text" id="nombreCliente" placeholder="Nombre completo">
                    <input type="tel" id="nequiCliente" placeholder="Número Nequi">
                    <button class="btn btn-success" style="width: 100%;" onclick="enviarReservaWhatsApp()">💬 Enviar WhatsApp</button>
                </div>` : ''}
            `;
            abrirModal('modalVerRifa');
        }

        function cambiarEstadoAdmin(numero) {
            const num = rifaActual.numeros[numero];
            const estados = ['disponible', 'reservado', 'vendido'];
            const nextIdx = (estados.indexOf(num.estado) + 1) % 3;
            const nuevoEstado = estados[nextIdx];

            db.ref(`rifas/${rifaActual.id}/numeros/${numero}`).update({ estado: nuevoEstado });
            // Si el admin libera un número, borramos la reserva temporal
            if (nuevoEstado === 'disponible') db.ref(`reservasActivas/${rifaActual.id}-${numero}`).remove();
        }

        function seleccionarNumero(numero) {
            const index = numerosSeleccionados.indexOf(numero);
            index > -1 ? numerosSeleccionados.splice(index, 1) : numerosSeleccionados.push(numero);
            verRifa(rifaActual.id, true);
        }

        function enviarReservaWhatsApp() {
            const nombre = document.getElementById('nombreCliente').value;
            const nequi = document.getElementById('nequiCliente').value;
            if (!nombre || !nequi || numerosSeleccionados.length === 0) return alert('Completa los datos');

            numerosSeleccionados.forEach(n => {
                db.ref(`rifas/${rifaActual.id}/numeros/${n}`).update({ estado: 'reservado' });
                db.ref(`reservasActivas/${rifaActual.id}-${n}`).set({
                    rifaId: rifaActual.id,
                    numero: n,
                    timestamp: Date.now()
                });
            });

            const msg = `¡Reserva Rifa: ${rifaActual.nombre}!\nNombre: ${nombre}\nNúmeros: ${numerosSeleccionados.join(', ')}\nTotal: $${numerosSeleccionados.length * rifaActual.precio}`;
            window.open(`https://wa.me/57${NEQUI}?text=${encodeURIComponent(msg)}`, '_blank');
            cerrarModal('modalVerRifa');
        }

        function verificarReservasExpiradas() {
            const ahora = Date.now();
            const limite = 5 * 60 * 1000; // 5 min
            Object.keys(reservasActivas).forEach(key => {
                const res = reservasActivas[key];
                if (ahora - res.timestamp > limite) {
                    db.ref(`rifas/${res.rifaId}/numeros/${res.numero}`).update({ estado: 'disponible' });
                    db.ref(`reservasActivas/${key}`).remove();
                }
            });
        }

        function eliminarRifa(id) {
            if (confirm('¿Eliminar rifa?')) db.ref(`rifas/${id}`).remove();
        }

        function abrirModal(id) { document.getElementById(id).classList.add('active'); }
        function cerrarModal(id) { document.getElementById(id).classList.remove('active'); if(id==='modalVerRifa') rifaActual=null; }

        init();
    </script>
</body>
</html>
