<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Rifas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px;
            margin-bottom: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
            padding: 8px 12px;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .rifas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .rifa-card {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .rifa-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .rifa-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .rifa-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            color: #555;
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 0.9em;
            margin-top: 10px;
        }

        .stat-vendido { color: #10b981; font-weight: bold; }
        .stat-porpagar { color: #f59e0b; font-weight: bold; }
        .stat-disponible { color: #ef4444; font-weight: bold; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            max-width: 900px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            color: #667eea;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
        }

        .close-btn:hover {
            color: #764ba2;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .numeros-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(50px, 1fr));
            gap: 8px;
            margin: 20px 0;
            max-width: 100%;
        }

        .numero-btn {
            aspect-ratio: 1;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: clamp(0.8rem, 2vw, 1.1rem);
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
            min-height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .numero-btn:hover {
            transform: scale(1.1);
        }

        .numero-btn.disponible {
            background: #ef4444;
        }

        .numero-btn.reservado {
            background: #f59e0b;
        }

        .numero-btn.vendido {
            background: #10b981;
        }

        .numero-btn:disabled {
            cursor: default;
        }

        .numero-btn.seleccionado {
            background: #8b5cf6;
            border: 3px solid #fbbf24;
        }

        .formulario-reserva {
            background: #f3f4f6;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .formulario-reserva input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .numeros-seleccionados {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .numeros-seleccionados h4 {
            margin-bottom: 10px;
            color: #333;
        }

        .badges-numeros {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .badge-numero {
            background: #8b5cf6;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: bold;
        }

        .leyenda {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .leyenda-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .leyenda-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            color: #9ca3af;
            margin-bottom: 20px;
        }

        .empty-state p {
            color: #6b7280;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-group .btn {
            flex: 1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .numeros-grid {
                grid-template-columns: repeat(auto-fit, minmax(45px, 1fr));
                gap: 6px;
            }

            .numero-btn {
                font-size: clamp(0.7rem, 3vw, 1rem);
                min-height: 40px;
            }

            .rifas-grid {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 20px;
                width: 98%;
            }

            .card {
                padding: 20px;
            }

            .leyenda {
                font-size: 0.85em;
            }

            .btn {
                padding: 10px 16px;
                font-size: 14px;
            }
        }

        @media (min-width: 769px) and (max-width: 1024px) {
            .numeros-grid {
                grid-template-columns: repeat(auto-fit, minmax(55px, 1fr));
            }
        }

        @media (min-width: 1025px) {
            .numeros-grid {
                grid-template-columns: repeat(10, 1fr);
                max-width: 700px;
                margin-left: auto;
                margin-right: auto;
            }

            .numero-btn {
                font-size: 1.1rem;
                min-height: 50px;
            }
        }

        .rifa-detail-header {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>Sistema de Rifas</h1>
                <div style="display: flex; gap: 10px;">
                    <button class="btn btn-success" id="btnGrupo" style="display: none;">
                        📱 Grupo WhatsApp
                    </button>
                    <button class="btn btn-primary" id="btnAdmin">
                        ⚙️ Admin
                    </button>
                </div>
            </div>

            <div id="rifasContainer"></div>
        </div>
    </div>

    <!-- Modal Login Admin -->
    <div class="modal" id="modalLogin">
        <div class="modal-content" style="max-width: 400px;">
            <span class="close-btn" onclick="cerrarModal('modalLogin')">← Volver</span>
            <h2 style="margin-bottom: 20px;">Acceso Administrador</h2>
            <div class="form-group">
                <input type="password" id="inputPassword" placeholder="Contraseña" onkeypress="if(event.key==='Enter') login()">
            </div>
            <button class="btn btn-primary" style="width: 100%;" onclick="login()">Ingresar</button>
        </div>
    </div>

    <!-- Modal Nueva Rifa -->
    <div class="modal" id="modalNuevaRifa">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal('modalNuevaRifa')">← Volver</span>
            <h2 style="margin-bottom: 20px;">Nueva Rifa</h2>
            <div class="form-group">
                <label>Nombre de la rifa</label>
                <input type="text" id="nombreRifa" placeholder="Ej: Rifa Navideña 2024">
            </div>
            <div class="form-group">
                <label>Precio por número</label>
                <input type="number" id="precioRifa" placeholder="Ej: 5000">
            </div>
            <div class="form-group">
                <label>Premio</label>
                <input type="text" id="premioRifa" placeholder="Ej: Celular Samsung">
            </div>
            <div class="form-group">
                <label>Fecha del sorteo (Lotería de Boyacá)</label>
                <input type="date" id="fechaRifa">
            </div>
            <div class="form-group">
                <label>Link del grupo de WhatsApp (opcional)</label>
                <input type="text" id="whatsappGrupo" placeholder="https://chat.whatsapp.com/...">
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="crearRifa()">Crear Rifa</button>
                <button class="btn btn-secondary" onclick="cerrarModal('modalNuevaRifa')">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Ver Rifa -->
    <div class="modal" id="modalVerRifa">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal('modalVerRifa')">← Volver</span>
            <div id="rifaDetalleContainer"></div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'admin123';
        const NEQUI = '3116516861';
        let isAdmin = false;
        let rifas = JSON.parse(localStorage.getItem('rifas')) || [];
        let whatsappGrupo = localStorage.getItem('whatsappGrupo') || '';
        let rifaActual = null;
        let numerosSeleccionados = [];
        let reservasActivas = JSON.parse(localStorage.getItem('reservasActivas')) || {};

        function init() {
            renderRifas();
            verificarReservasExpiradas();
            setInterval(verificarReservasExpiradas, 10000);
            if (whatsappGrupo) {
                document.getElementById('btnGrupo').style.display = 'inline-flex';
                document.getElementById('btnGrupo').onclick = () => window.open(whatsappGrupo, '_blank');
            }
            document.getElementById('btnAdmin').onclick = () => {
                if (isAdmin) {
                    abrirModal('modalNuevaRifa');
                } else {
                    abrirModal('modalLogin');
                }
            };
        }

        function login() {
            const password = document.getElementById('inputPassword').value;
            if (password === ADMIN_PASSWORD) {
                isAdmin = true;
                document.getElementById('btnAdmin').innerHTML = '➕ Nueva Rifa';
                cerrarModal('modalLogin');
                alert('¡Acceso concedido!');
            } else {
                alert('Contraseña incorrecta');
            }
        }

        function crearRifa() {
            const nombre = document.getElementById('nombreRifa').value;
            const precio = document.getElementById('precioRifa').value;
            const premio = document.getElementById('premioRifa').value;
            const fecha = document.getElementById('fechaRifa').value;
            const whatsapp = document.getElementById('whatsappGrupo').value;

            if (!nombre || !precio || !premio || !fecha) {
                alert('Por favor complete todos los campos obligatorios');
                return;
            }

            const numeros = [];
            for (let i = 1; i <= 100; i++) {
                numeros.push({ numero: i, estado: 'disponible' });
            }

            const rifa = {
                id: Date.now(),
                nombre,
                precio,
                premio,
                fecha,
                numeros
            };

            rifas.push(rifa);
            localStorage.setItem('rifas', JSON.stringify(rifas));

            if (whatsapp) {
                whatsappGrupo = whatsapp;
                localStorage.setItem('whatsappGrupo', whatsapp);
                document.getElementById('btnGrupo').style.display = 'inline-flex';
                document.getElementById('btnGrupo').onclick = () => window.open(whatsappGrupo, '_blank');
            }

            document.getElementById('nombreRifa').value = '';
            document.getElementById('precioRifa').value = '';
            document.getElementById('premioRifa').value = '';
            document.getElementById('fechaRifa').value = '';
            document.getElementById('whatsappGrupo').value = '';

            cerrarModal('modalNuevaRifa');
            renderRifas();
        }

        function renderRifas() {
            const container = document.getElementById('rifasContainer');
            
            if (rifas.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        <p>No hay rifas disponibles</p>
                        ${isAdmin ? '<button class="btn btn-primary" onclick="abrirModal(\'modalNuevaRifa\')">Crear Primera Rifa</button>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = `<div class="rifas-grid">${rifas.map(rifa => {
                const vendidos = rifa.numeros.filter(n => n.estado === 'vendido').length;
                const reservados = rifa.numeros.filter(n => n.estado === 'reservado').length;
                const disponibles = rifa.numeros.filter(n => n.estado === 'disponible').length;

                return `
                    <div class="rifa-card">
                        ${isAdmin ? `<button class="btn btn-danger" style="float: right;" onclick="eliminarRifa(${rifa.id})">🗑️</button>` : ''}
                        <h3>${rifa.nombre}</h3>
                        <div class="rifa-info">
                            <div class="info-item">💰 Precio: $${rifa.precio}</div>
                            <div class="info-item">🏆 Premio: ${rifa.premio}</div>
                            <div class="info-item">📅 Sorteo: ${rifa.fecha}</div>
                            <div class="stats">
                                <span class="stat-vendido">Vendidos: ${vendidos}</span>
                                <span class="stat-porpagar">Reservados: ${reservados}</span>
                                <span class="stat-disponible">Disponibles: ${disponibles}</span>
                            </div>
                        </div>
                        <button class="btn btn-primary" style="width: 100%;" onclick="verRifa(${rifa.id})">
                            👁️ Ver Cartón
                        </button>
                    </div>
                `;
            }).join('')}</div>`;
        }

        function verRifa(id) {
            rifaActual = rifas.find(r => r.id === id);
            if (!rifaActual) return;
            numerosSeleccionados = [];

            const container = document.getElementById('rifaDetalleContainer');
            container.innerHTML = `
                <h2>${rifaActual.nombre}</h2>
                <div class="rifa-detail-header">
                    <div class="info-item">💰 Precio: $${rifaActual.precio}</div>
                    <div class="info-item">🏆 Premio: ${rifaActual.premio}</div>
                    <div class="info-item">📅 Sorteo: ${rifaActual.fecha}</div>
                </div>
                <div class="leyenda">
                    <div class="leyenda-item">
                        <div class="leyenda-color" style="background: #10b981;"></div>
                        <span>Vendido</span>
                    </div>
                    <div class="leyenda-item">
                        <div class="leyenda-color" style="background: #f59e0b;"></div>
                        <span>Reservado (5 min)</span>
                    </div>
                    <div class="leyenda-item">
                        <div class="leyenda-color" style="background: #ef4444;"></div>
                        <span>Disponible</span>
                    </div>
                    ${!isAdmin ? `<div class="leyenda-item">
                        <div class="leyenda-color" style="background: #8b5cf6;"></div>
                        <span>Mis selecciones</span>
                    </div>` : ''}
                </div>
                <div class="numeros-grid" id="numerosGrid">
                    ${rifaActual.numeros.map(num => `
                        <button 
                            class="numero-btn ${num.estado}" 
                            id="num-${num.numero}"
                            onclick="${isAdmin ? `cambiarEstadoAdmin(${num.numero})` : `seleccionarNumero(${num.numero})`}"
                            ${(!isAdmin && (num.estado === 'vendido' || num.estado === 'reservado')) ? 'disabled' : ''}
                        >
                            ${num.numero}
                        </button>
                    `).join('')}
                </div>
                ${!isAdmin ? `
                <div class="formulario-reserva" id="formularioReserva" style="display: none;">
                    <div class="numeros-seleccionados">
                        <h4>Números seleccionados:</h4>
                        <div class="badges-numeros" id="badgesNumeros"></div>
                    </div>
                    <input type="text" id="nombreCliente" placeholder="Tu nombre completo" required>
                    <input type="tel" id="nequiCliente" placeholder="Tu número de Nequi" required>
                    <button class="btn btn-success" style="width: 100%;" onclick="enviarReservaWhatsApp()">
                        💬 Enviar Reserva por WhatsApp
                    </button>
                </div>
                ` : ''}
            `;
            abrirModal('modalVerRifa');
        }

        function cambiarEstadoAdmin(numero) {
            if (!isAdmin) return;

            const num = rifaActual.numeros.find(n => n.numero === numero);
            if (!num) return;

            const estados = ['disponible', 'reservado', 'vendido'];
            const currentIndex = estados.indexOf(num.estado);
            num.estado = estados[(currentIndex + 1) % 3];

            if (num.estado === 'disponible' && reservasActivas[`${rifaActual.id}-${numero}`]) {
                delete reservasActivas[`${rifaActual.id}-${numero}`];
            }

            rifas = rifas.map(r => r.id === rifaActual.id ? rifaActual : r);
            localStorage.setItem('rifas', JSON.stringify(rifas));

            verRifa(rifaActual.id);
            renderRifas();
        }

        function seleccionarNumero(numero) {
            if (isAdmin) return;

            const num = rifaActual.numeros.find(n => n.numero === numero);
            if (!num || num.estado !== 'disponible') return;

            const index = numerosSeleccionados.indexOf(numero);
            const btnElement = document.getElementById(`num-${numero}`);

            if (index > -1) {
                numerosSeleccionados.splice(index, 1);
                btnElement.classList.remove('seleccionado');
            } else {
                numerosSeleccionados.push(numero);
                btnElement.classList.add('seleccionado');
            }

            actualizarFormulario();
        }

        function actualizarFormulario() {
            const formulario = document.getElementById('formularioReserva');
            const badgesContainer = document.getElementById('badgesNumeros');

            if (numerosSeleccionados.length > 0) {
                formulario.style.display = 'block';
                badgesContainer.innerHTML = numerosSeleccionados
                    .sort((a, b) => a - b)
                    .map(num => `<span class="badge-numero">${num}</span>`)
                    .join('');
            } else {
                formulario.style.display = 'none';
            }
        }

        function enviarReservaWhatsApp() {
            const nombre = document.getElementById('nombreCliente').value.trim();
            const nequi = document.getElementById('nequiCliente').value.trim();

            if (!nombre || !nequi) {
                alert('Por favor completa todos los campos');
                return;
            }

            if (numerosSeleccionados.length === 0) {
                alert('Por favor selecciona al menos un número');
                return;
            }

            numerosSeleccionados.forEach(numero => {
                const num = rifaActual.numeros.find(n => n.numero === numero);
                if (num && num.estado === 'disponible') {
                    num.estado = 'reservado';
                    const key = `${rifaActual.id}-${numero}`;
                    reservasActivas[key] = {
                        numero: numero,
                        rifaId: rifaActual.id,
                        timestamp: Date.now()
                    };
                }
            });

            rifas = rifas.map(r => r.id === rifaActual.id ? rifaActual : r);
            localStorage.setItem('rifas', JSON.stringify(rifas));
            localStorage.setItem('reservasActivas', JSON.stringify(reservasActivas));

            const total = numerosSeleccionados.length * rifaActual.precio;
            const numerosTexto = numerosSeleccionados.sort((a, b) => a - b).join(', ');

            const mensaje = `¡Hola! Quiero reservar números en la rifa: ${rifaActual.nombre}

📅 Sorteo: ${rifaActual.fecha}
🏆 Premio: ${rifaActual.premio}
💰 Precio por número: $${rifaActual.precio}

👤 Mis datos:
- Nombre: ${nombre}
- Nequi: ${nequi}
- Números: ${numerosTexto}
- Total a pagar: $${total}

💳 Nequi para pagos: ${NEQUI}

*Nota: Los números están reservados por 5 minutos, Reañiza el pago y hazlo tuyo para el sorteo los datos se actualizaran en la pagina.*`;

            window.open(`https://wa.me/57${NEQUI}?text=${encodeURIComponent(mensaje)}`, '_blank');

            alert('¡Números reservados! Te redirigimos a WhatsApp. Los números estarán reservados por 5 minutos.');
            cerrarModal('modalVerRifa');
            renderRifas();
        }

        function verificarReservasExpiradas() {
            const ahora = Date.now();
            const CINCO_MINUTOS = 5 * 60 * 1000;
            let cambios = false;

            Object.keys(reservasActivas).forEach(key => {
                const reserva = reservasActivas[key];
                if (ahora - reserva.timestamp > CINCO_MINUTOS) {
                    const rifa = rifas.find(r => r.id === reserva.rifaId);
                    if (rifa) {
                        const num = rifa.numeros.find(n => n.numero === reserva.numero);
                        if (num && num.estado === 'reservado') {
                            num.estado = 'disponible';
                            cambios = true;
                        }
                    }
                    delete reservasActivas[key];
                }
            });

            if (cambios) {
